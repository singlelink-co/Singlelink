# Use root/example as user/password credentials
version: '3.1'

services:
  launchlinks: # Renamed service to launchlinks
    ports:
      - 3000:3000
    image: launchlinks # Placeholder image name, user should build their own
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: launchlinks # Changed DB_DATABASE to launchlinks for consistency
      DB_USER: root
      DB_PASS: single-my-links # User should change this
      META_TITLE: LaunchLinks
      META_DESC: My LaunchLinks Docker Instance.
      META_IMG: # User should set this
      BRANDING: "true"

      SECRET: jwt_secret
      PASSWORD: password

  mysql:
    image: mysql
    # NOTE: use of "mysql_native_password" is not recommended: https://dev.mysql.com/doc/refman/8.0/en/upgrading-from-previous-series.html#upgrade-caching-sha2-password
    # (this is just an example, not intended to be a production configuration)
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: single-my-links # User should change this
      MYSQL_DATABASE: launchlinks # Changed DB_DATABASE to launchlinks for consistency